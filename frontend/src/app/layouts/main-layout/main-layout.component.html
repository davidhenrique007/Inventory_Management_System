<mat-toolbar color="primary" class="app-toolbar">
  <button mat-icon-button (click)="sidenav.toggle()" class="menu-button">
    <mat-icon>menu</mat-icon>
  </button>

  <span class="logo">Inventory Management</span>

  <span class="spacer"></span>

  <button mat-icon-button [matMenuTriggerFor]="userMenu">
    <mat-icon>account_circle</mat-icon>
  </button>

  <mat-menu #userMenu="matMenu">
    <button mat-menu-item disabled>
      <mat-icon>person</mat-icon>
      <span>{{ getUserName() }}</span>
    </button>
    <mat-divider></mat-divider>
    <button mat-menu-item (click)="logout()">
      <mat-icon>exit_to_app</mat-icon>
      <span>Sair</span>
    </button>
  </mat-menu>
</mat-toolbar>

<mat-sidenav-container class="sidenav-container">
  <!-- Mudando mode para "side" com opened=true para manter aberto -->
  <mat-sidenav #sidenav mode="side" opened="true" class="app-sidenav">
    <mat-nav-list>
      <a mat-list-item
         routerLink="/dashboard"
         routerLinkActive="active"
         (click)="sidenav.close()">
        <mat-icon mat-list-icon>dashboard</mat-icon>
        <span mat-line>Dashboard</span>
      </a>

      <a mat-list-item
         routerLink="/products"
         routerLinkActive="active"
         (click)="sidenav.close()">
        <mat-icon mat-list-icon>inventory_2</mat-icon>
        <span mat-line>Produtos</span>
      </a>

      <a mat-list-item
         routerLink="/categories"
         routerLinkActive="active"
         (click)="sidenav.close()">
        <mat-icon mat-list-icon>category</mat-icon>
        <span mat-line>Categorias</span>
      </a>

      <a mat-list-item
         routerLink="/movements"
         routerLinkActive="active"
         (click)="sidenav.close()">
        <mat-icon mat-list-icon>swap_horiz</mat-icon>
        <span mat-line>Movimentações</span>
      </a>

      <a mat-list-item
         routerLink="/reports"
         routerLinkActive="active"
         (click)="sidenav.close()">
        <mat-icon mat-list-icon>assessment</mat-icon>
        <span mat-line>Relatórios</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="sidenav-content">
    <div class="content-wrapper">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
